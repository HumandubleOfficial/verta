# Verta: huge pages only for programs that ask for them (Proton/Wine and many
# engines do), and never make a program wait while the kernel defragments
# memory to make one: that's done in the background instead.
w! /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w! /sys/kernel/mm/transparent_hugepage/khugepaged/defrag - - - - 0
