# Verta gaming tweaks.

# Don't stall threads that hit split locks; some games (and their anti-cheat)
# trigger these constantly and lose a lot of performance when mitigated.
kernel.split_lock_mitigate = 0

# Lots of memory mappings for newer games under Proton (matches SteamOS).
vm.max_map_count = 2147483642

# Fewer stutters from writeback: flush dirty pages earlier and in smaller chunks.
vm.dirty_background_bytes = 134217728
vm.dirty_bytes = 268435456

# Verta swaps to zram (compressed RAM), which is far cheaper than disk:
# prefer it over dropping file cache, and don't read ahead on it.
vm.swappiness = 100
vm.page-cluster = 0
# Keep directory/inode caches around longer (faster game asset lookups).
vm.vfs_cache_pressure = 50

# The NMI watchdog costs a perf counter and a little CPU time on every core.
kernel.nmi_watchdog = 0

# Memory: no background compaction or watermark boosts (both cause short
# stalls mid-game), and don't let one thread hog a contended page lock
# (the same settings as SteamOS).
vm.compaction_proactiveness = 0
vm.watermark_boost_factor = 1
vm.page_lock_unfairness = 1

# Network: BBR congestion control with fair queueing keeps ping steady while
# Steam or a browser downloads, and gets more out of fast connections.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Reconnect faster to servers you've talked to before.
net.ipv4.tcp_fastopen = 3
# Don't drop packets when a burst arrives faster than they can be handled.
net.core.netdev_max_backlog = 16384
# Keep connections warm after idling (no slow start after a pause).
net.ipv4.tcp_slow_start_after_idle = 0
