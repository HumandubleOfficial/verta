<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
    Verta's system font is Inter, everywhere: KDE and GTK apps, Firefox, the
    installer and web pages that ask for "the system font".

    Apple's San Francisco may only be used on Apple's own systems, so Verta
    can't ship it. Inter was drawn for the same job (a neutral, very legible
    interface face with tight, even spacing), so pages and apps that ask for
    Apple's or Windows' system font by name get Inter instead of a fallback.

    Linked into /etc/fonts/conf.d by 30-desktop.sh.
-->
<fontconfig>
    <description>Verta: Inter is the system font</description>

    <!-- The generic families apps and web pages fall back to. -->
    <alias binding="same">
        <family>sans-serif</family>
        <prefer><family>Inter</family></prefer>
    </alias>
    <!-- Cantarell's own rule (31-cantarell.conf) claims system-ui first, so
         Inter goes to the very front rather than in front of system-ui. -->
    <match target="pattern">
        <test name="family"><string>system-ui</string></test>
        <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
    </match>
    <alias binding="same">
        <family>ui-sans-serif</family>
        <prefer><family>Inter</family></prefer>
    </alias>

    <!-- Asked for by name on sites made for Macs, iPhones and Windows. -->
    <alias binding="same"><family>-apple-system</family><accept><family>Inter</family></accept></alias>
    <alias binding="same"><family>BlinkMacSystemFont</family><accept><family>Inter</family></accept></alias>
    <alias binding="same"><family>SF Pro</family><accept><family>Inter</family></accept></alias>
    <alias binding="same"><family>SF Pro Text</family><accept><family>Inter</family></accept></alias>
    <alias binding="same"><family>SF Pro Display</family><accept><family>Inter Display</family></accept></alias>
    <alias binding="same"><family>San Francisco</family><accept><family>Inter</family></accept></alias>
    <alias binding="same"><family>Helvetica Neue</family><accept><family>Inter</family></accept></alias>
    <alias binding="same"><family>Segoe UI</family><accept><family>Inter</family></accept></alias>
    <alias binding="same"><family>Segoe UI Variable</family><accept><family>Inter</family></accept></alias>

    <!-- Apple's code fonts: the system's monospace font. -->
    <alias binding="same"><family>SF Mono</family><default><family>monospace</family></default></alias>
    <alias binding="same"><family>ui-monospace</family><default><family>monospace</family></default></alias>
    <alias binding="same"><family>Menlo</family><default><family>monospace</family></default></alias>
</fontconfig>
