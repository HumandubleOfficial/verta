<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Verta: let administrators (wheel) switch the CPU scheduler mode from
     Verta Settings without a password prompt. Everyone else gets pkexec. -->
<busconfig>
  <policy group="wheel">
    <allow send_destination="org.scx.Loader"/>
  </policy>
</busconfig>
