name: Build Verta images

# Builds both Verta flavors and publishes them to GitHub Container Registry.
# Installed Verta systems update from these images (sudo bootc upgrade, or the
# Updates page in Discover). The daily run picks up Fedora / Universal Blue
# security and driver updates even when nothing in this repo changed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "art/**"
      - "docs/**"
      - "installer/**"
      - "disk_config/**"
      - "scripts/new-test-vm.ps1"
      - "scripts/setup-wsl.sh"
      - "scripts/build-iso.sh"
      - "scripts/brand-iso.sh"
      - "scripts/render-art.sh"
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.flavor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [verta, verta-nvidia]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # The base image plus build layers need ~25 GB; the runner image
          # ships SDKs we don't use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /

      - name: Build image
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          VERTA_VERSION="$(date -u +%Y.%m.%d)"
          echo "VERTA_VERSION=$VERTA_VERSION" >> "$GITHUB_ENV"
          sudo env VERTA_VERSION="$VERTA_VERSION" \
                   IMAGE_SOURCE="${{ github.server_url }}/${{ github.repository }}" \
                   bash scripts/build-image.sh "$FLAVOR"

      - name: Publish to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          FLAVOR: ${{ matrix.flavor }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/${FLAVOR}"
          echo "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$REGISTRY_USER" --password-stdin
          for tag in latest "$VERTA_VERSION" "${VERTA_VERSION}.${RUN_NUMBER}"; do
            sudo podman tag "localhost/${FLAVOR}:latest" "${IMAGE}:${tag}"
            sudo podman push --retry 3 "${IMAGE}:${tag}"
          done
          echo "Published ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
